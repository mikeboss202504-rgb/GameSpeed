name: Build TiDeng Speed LSPosed Module

on:
  push:
    branches: [ "master", "main" ] # 当你向 master 或 main 分支推送代码时触发
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch: # 支持在 GitHub Actions 页面上手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. 强制安装 JDK 11。它是兼容老版 Android Gradle 插件（AGP）且能稳定跑在 GitHub Runner 上的黄金版本
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    # 2. 精准锁死老项目专用的 Gradle 7.5 构建工具，完美跳过新版 Gradle 的多项强制过时审查
    - name: Setup Gradle 7.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '7.5'

    # 3. 自动化补全环境。如果检测到根目录下缺失核心总控脚本文件，将在云端动态生成路由，强行绑定 :app 子项目
    - name: Ensure Settings Gradle
      run: |
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'GameSpeed'" >> settings.gradle
          echo "Created vital configuration environment successfully."
        fi

    # 4. 调用编译指令，对 :app 目标模块进行 Release 离线打包
    - name: Build with Gradle
      run: gradle :app:assembleRelease

    # 5. 回收编译产物。自动检索 app 目录下生成的所有 APK 文件，打包打包上架供你直接下载
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiDeng-Speed-APK
        path: app/build/outputs/apk/release/*.apk