name: Build TiDeng Speed LSPosed Module

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. 强制安装 JDK 17。因为 AGP 8.4.0 配合 Gradle 8.6 必须在 Java 17 上运行
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 2. ⭐ 核心修复：将云端编译环境精准锁死在要求的最低版本 Gradle 8.6
    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    # 3. 自动化补全环境（防止缺失 settings.gradle 引发单项目错乱）
    - name: Ensure Settings Gradle
      run: |
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'GameSpeed'" >> settings.gradle
          echo "Created vital configuration environment successfully."
        fi

    # 4. 执行编译
    - name: Build with Gradle
      run: gradle :app:assembleRelease

    # 5. 回收编译产物
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiDeng-Speed-APK
        path: app/build/outputs/apk/release/*.apk
