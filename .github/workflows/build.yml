name: Build TiDeng Speed LSPosed Module

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout project sources
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.6
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.6'

    - name: Ensure Settings Gradle
      run: |
        if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
          echo "include ':app'" > settings.gradle
          echo "rootProject.name = 'GameSpeed'" >> settings.gradle
        fi

    # ⭐ 核心修改：改为编译 Debug 版，这样会自动带上系统默认的测试签名
    - name: Build with Gradle
      run: gradle :app:assembleDebug

    # ⭐ 核心修改：产物回收路径也要同步改成 debug 目录
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TiDeng-Speed-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
